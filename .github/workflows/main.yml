name: Build Minicraft APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project
        run: |
          unzip -o MinicraftAndroid.zip -d project
          ls -la project

      - name: Build APK
        run: |
          cd project/MinicraftAndroid
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Minicraft-APK
          path: project/MinicraftAndroid/app/build/outputs/apk/debug/*.apk
